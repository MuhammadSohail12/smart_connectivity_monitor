name: smart_connectivity_monitor
description: Production-grade Flutter package for real-time internet connectivity monitoring with caching, quality detection, and built-in UI widgets.
version: 1.0.2
homepage: https://github.com/MuhammadSohail12/smart_connectivity_monitor
repository: https://github.com/MuhammadSohail12/smart_connectivity_monitor
issue_tracker: https://github.com/MuhammadSohail12/smart_connectivity_monitor/issues

topics:
  - connectivity
  - network
  - internet
  - monitoring
  - flutter

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ">=7.1.1 <8.0.0"
  http: ">=1.6.0 <2.0.0"
  rxdart: ">=0.28.0 <0.29.0"
  shared_preferences: ">=2.5.5 <3.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^4.0.0
